<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VKU Field Survey PWA</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Thư viện IndexedDB thông qua LocalForage chống mất dữ liệu khi refresh -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: #0f172a; color: #f1f5f9; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 700px; background: #1e293b; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); }
        h1 { font-size: 1.5rem; color: #38bdf8; margin-bottom: 5px; text-align: center; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
        .stat-card { background: #0f172a; padding: 12px; border-radius: 8px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-card h4 { font-size: 0.75rem; color: #94a3b8; margin-bottom: 5px; }
        .stat-card span { font-size: 1.2rem; font-weight: 700; color: #38bdf8; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 12px; }
        .full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 0.85rem; }
        input, select, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: white; font-size: 0.9rem; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #38bdf8; }
        
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 5px; }
        button:hover { background: #0ea5e9; }
        .btn-secondary { background: #334155; margin-bottom: 10px; }
        .btn-secondary:hover { background: #475569; }

        .step-section { display: none; }
        .step-section.active { display: block; }
        
        .status-badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; margin-bottom: 15px; }
        .online { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .offline { background: rgba(239, 68, 68, 0.2); color: #f87171; }
        
        .history { margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .history h3 { font-size: 0.95rem; margin-bottom: 10px; color: #38bdf8; }
        .history-item { background: #0f172a; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.8rem; color: #94a3b8; border-left: 3px solid #0284c7; }
        .preview-img { max-width: 90px; max-height: 90px; margin-top: 5px; border-radius: 4px; display: block; }
    </style>
</head>
<body>

<div class="container">
    <h1>VKU Field Survey PWA</h1>
    <p class="subtitle">Hệ thống kiểm tra hạ tầng ngoại tuyến kết nối Cloudflare D1</p>
    
    <div style="text-align: center;">
        <span id="netStatus" class="status-badge online">🟢 Trạng thái: Trực tuyến</span>
    </div>

    <!-- Dashboard Thống kê tổng hợp dữ liệu -->
    <div class="stats-grid">
        <div class="stat-card">
            <h4>Tổng số phiếu</h4>
            <span id="totalCount">0</span>
        </div>
        <div class="stat-card">
            <h4>Đã đồng bộ</h4>
            <span id="syncedCount" style="color: #34d399;">0</span>
        </div>
        <div class="stat-card">
            <h4>Chờ đồng bộ</h4>
            <span id="pendingCount" style="color: #f87171;">0</span>
        </div>
    </div>

    <form id="surveyForm">
        <!-- BƯỚC 1: THÔNG TIN NGƯỜI ĐÁNH GIÁ -->
        <div id="step1" class="step-section active">
            <h3 style="color: #38bdf8; font-size: 1rem; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;">Bước 1: Thông tin người đánh giá</h3>
            
            <div class="form-group full-width">
                <label>Họ và tên người khảo sát *</label>
                <input type="text" id="inspectorName" placeholder="Ví dụ: Nguyễn Văn A" required>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Mã sinh viên / Mã nhân viên *</label>
                    <input type="text" id="inspectorId" placeholder="Ví dụ: 23IT001" required>
                </div>
                <div class="form-group">
                    <label>Khoa / Đơn vị công tác</label>
                    <input type="text" id="inspectorDept" placeholder="Ví dụ: Khoa CNTT">
                </div>
            </div>

            <button type="button" onclick="goToStep2()">Tiếp tục sang Bảng đánh giá thiết bị &rarr;</button>
        </div>

        <!-- BƯỚC 2: ĐÁNH GIÁ THIẾT BỊ VÀ KHU VỰC -->
        <div id="step2" class="step-section">
            <h3 style="color: #38bdf8; font-size: 1rem; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;">Bước 2: Chi tiết vị trí và thiết bị</h3>
            
            <button type="button" class="btn-secondary" onclick="goToStep1()">&larr; Quay lại sửa thông tin cá nhân</button>

            <div class="form-grid">
                <div class="form-group">
                    <label>Tòa nhà</label>
                    <select id="building" required>
                        <option value="Tòa A - Hành chính hiệu bộ">Tòa A - Hành chính hiệu bộ</option>
                        <option value="Tòa B - Giảng đường đa năng">Tòa B - Giảng đường đa năng</option>
                        <option value="Tòa C - Trung tâm Thực hành & Thí nghiệm">Tòa C - Thực hành</option>
                        <option value="Tòa E - Khoa học Công nghệ">Tòa E - Khoa CNTT</option>
                        <option value="Ký túc xá KTX">Ký túc xá (KTX)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tầng</label>
                    <select id="floor" required>
                        <option value="Tầng Trệt / G">Tầng Trệt / G</option>
                        <option value="Tầng 1">Tầng 1</option>
                        <option value="Tầng 2">Tầng 2</option>
                        <option value="Tầng 3">Tầng 3</option>
                        <option value="Tầng 4">Tầng 4</option>
                        <option value="Tầng 5">Tầng 5</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Số phòng / Khu vực</label>
                    <input type="text" id="room" placeholder="Ví dụ: A301, Lab 2..." required>
                </div>
                <div class="form-group">
                    <label>Hạng mục thiết bị cụ thể</label>
                    <select id="category">
                        <option value="Hệ thống Điều hòa (AC)">❄️ Hệ thống Điều hòa (AC)</option>
                        <option value="Hệ thống Quạt điện (Quạt trần/Quạt treo)">🌀 Hệ thống Quạt điện (Quạt trần/Quạt treo)</option>
                        <option value="Hệ thống Máy tính & Phần cứng">🖥️ Hệ thống Máy tính & Phần cứng</option>
                        <option value="Hệ thống Máy chiếu & Âm thanh">🎤 Hệ thống Máy chiếu & Âm thanh</option>
                        <option value="Hệ thống Chiếu sáng & Ổ điện">💡 Hệ thống Chiếu sáng & Ổ điện</option>
                        <option value="Trang thiết bị Nội thất (Bàn ghế)">🪑 Trang thiết bị Nội thất (Bàn ghế)</option>
                        <option value="Hệ thống Mạng Internet / Wifi">🌐 Hệ thống Mạng Internet / Wifi</option>
                        <option value="Cửa ra vào & Khóa thông minh">🚪 Cửa ra vào & Khóa thông minh</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Đánh giá tổng quan thiết bị</label>
                    <select id="rating">
                        <option value="5 Sao - Hoàn hảo, hoạt động tốt">⭐⭐⭐⭐⭐ 5 Sao - Hoàn hảo, hoạt động tốt</option>
                        <option value="4 Sao - Ổn định, ít hao mòn">⭐⭐⭐⭐ 4 Sao - Ổn định, ít hao mòn</option>
                        <option value="3 Sao - Cần theo dõi, bảo dưỡng nhẹ">⭐⭐⭐ 3 Sao - Cần theo dõi, bảo dưỡng nhẹ</option>
                        <option value="2 Sao - Hư hỏng vừa, cần sửa gấp">⭐⭐ 2 Sao - Hư hỏng vừa, cần sửa gấp</option>
                        <option value="1 Sao - Hỏng nặng / Ngừng hoạt động">⭐ 1 Sao - Hỏng nặng / Ngừng hoạt động</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Mức độ khẩn cấp</label>
                    <select id="priority">
                        <option value="Bình thường">Bình thường (Theo định kỳ)</option>
                        <option value="Ưu tiên trung bình">Ưu tiên trung bình</option>
                        <option value="Khẩn cấp - Ảnh hưởng dạy học">🚨 Khẩn cấp - Ảnh hưởng dạy học</option>
                    </select>
                </div>
            </div>

            <div class="form-group full-width">
                <label>Ghi chú chi tiết sự cố (Tình trạng quạt, điều hòa, v.v.)</label>
                <textarea id="notes" rows="2" placeholder="Ví dụ: Điều hòa không lạnh / Quạt trần số 3 bị kêu to..."></textarea>
            </div>

            <div class="form-group full-width">
                <label>Ảnh chụp hiện trạng thiết bị</label>
                <input type="file" id="photoInput" accept="image/*">
                <img id="imagePreview" class="preview-img" style="display:none;" alt="Preview">
            </div>

            <button type="submit">Lưu & Đồng bộ Cloudflare D1</button>
        </div>
    </form>

    <div class="history">
        <h3>Hàng đợi ngoại tuyến & Lịch sử (IndexedDB)</h3>
        <div id="historyList"><p style="font-size: 0.8rem; color: #64748b;">Đang tải dữ liệu...</p></div>
    </div>
</div>

<script>
    const CLOUDFLARE_WORKER_URL = 'https://vku-survey-worker.vku-survey-app.workers.dev';

    localforage.config({
        driver: localforage.INDEXEDDB,
        name: 'VKU_FieldSurvey_DB',
        storeName: 'surveys'
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
    }

    // Điều hướng giữa Bước 1 và Bước 2
    function goToStep2() {
        const name = document.getElementById('inspectorName').value.trim();
        const id = document.getElementById('inspectorId').value.trim();
        if (!name || !id) {
            alert('Vui lòng nhập đầy đủ Họ tên và Mã số cá nhân ở Bước 1!');
            return;
        }
        document.getElementById('step1').classList.remove('active');
        document.getElementById('step2').classList.add('active');
    }

    function goToStep1() {
        document.getElementById('step2').classList.remove('active');
        document.getElementById('step1').classList.add('active');
    }

    let capturedPhotoData = '';
    const photoInput = document.getElementById('photoInput');
    const imagePreview = document.getElementById('imagePreview');
    
    photoInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                capturedPhotoData = uploadEvent.target.result;
                imagePreview.src = capturedPhotoData;
                imagePreview.style.display = 'block';
            };
            reader.readAsDataURL(file);
        }
    });

    const statusBadge = document.getElementById('netStatus');

    async function updateNetworkStatus() {
        if (navigator.onLine) {
            statusBadge.className = 'status-badge online';
            statusBadge.innerText = '🟢 Trạng thái: Trực tuyến (Online)';
            await processBackgroundSync();
        } else {
            statusBadge.className = 'status-badge offline';
            statusBadge.innerText = '🔴 Trạng thái: Ngoại tuyến (Offline Mode)';
        }
    }

    window.addEventListener('online', updateNetworkStatus);
    window.addEventListener('offline', updateNetworkStatus);
    updateNetworkStatus();

    function generateUUID() {
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });
    }

    async function sendToCloudflare(record) {
        try {
            let response = await fetch(CLOUDFLARE_WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(record)
            });
            return response.ok;
        } catch (error) {
            console.error('Lỗi kết nối Cloudflare:', error);
            return false;
        }
    }

    async function loadDashboardData() {
        let keys = await localforage.keys();
        let total = keys.length;
        let synced = 0;
        let pending = 0;
        let records = [];

        for (let key of keys) {
            let item = await localforage.getItem(key);
            if (item) records.push(item);
        }

        records.sort((a, b) => new Date(b.rawTime) - new Date(a.rawTime));

        let itemsHTML = '';
        records.forEach(item => {
            if (item.syncStatus === 'SYNCED') synced++;
            else pending++;

            itemsHTML += `
                <div class="history-item">
                    <strong>👤 ${item.inspectorName} (${item.inspectorId})</strong> - [${item.building} - ${item.floor} - Phòng ${item.room}]<br>
                    <span>Hạng mục: <b>${item.category}</b> | Đánh giá: ${item.rating}</span><br>
                    <span>Mức độ: <b>${item.priority || 'Bình thường'}</b> | Ghi chú: ${item.notes || 'Không có'}</span><br>
                    ${item.photo ? `<img src="${item.photo}" class="preview-img">` : ''}
                    <small style="color: ${item.syncStatus === 'SYNCED' ? '#34d399' : '#f87171'};">
                        Trạng thái: [${item.syncStatus}] | UUID: ${item.uuid} | ${item.time}
                    </small>
                </div>
            `;
        });

        document.getElementById('totalCount').innerText = total;
        document.getElementById('syncedCount').innerText = synced;
        document.getElementById('pendingCount').innerText = pending;
        document.getElementById('historyList').innerHTML = itemsHTML || '<p style="font-size: 0.8rem; color: #64748b;">Chưa có dữ liệu khảo sát nào.</p>';
    }

    async function processBackgroundSync() {
        let keys = await localforage.keys();
        let hasChanges = false;
        for (let key of keys) {
            let item = await localforage.getItem(key);
            if (item && item.syncStatus === 'PENDING_SYNC') {
                let success = await sendToCloudflare(item);
                if (success) {
                    item.syncStatus = 'SYNCED';
                    await localforage.setItem(key, item);
                    hasChanges = true;
                }
            }
        }
        if (hasChanges) {
            loadDashboardData();
        }
    }

    const form = document.getElementById('surveyForm');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const uniqueId = generateUUID();
        const isOnline = navigator.onLine;

        const newRecord = {
            uuid: uniqueId,
            inspectorName: document.getElementById('inspectorName').value,
            inspectorId: document.getElementById('inspectorId').value,
            inspectorDept: document.getElementById('inspectorDept').value,
            building: document.getElementById('building').value,
            floor: document.getElementById('floor').value,
            room: document.getElementById('room').value,
            category: document.getElementById('category').value,
            rating: document.getElementById('rating').value,
            priority: document.getElementById('priority').value,
            notes: document.getElementById('notes').value,
            photo: capturedPhotoData,
            syncStatus: 'PENDING_SYNC',
            rawTime: new Date().toISOString(),
            time: new Date().toLocaleString('vi-VN')
        };

        if (isOnline) {
            let success = await sendToCloudflare(newRecord);
            if (success) {
                newRecord.syncStatus = 'SYNCED';
            }
        }

        await localforage.setItem(uniqueId, newRecord);

        form.reset();
        capturedPhotoData = '';
        imagePreview.style.display = 'none';
        goToStep1(); // Quay lại bước 1 cho người tiếp theo
        
        await loadDashboardData();

        if (newRecord.syncStatus === 'SYNCED') {
            alert('Đã lưu biểu mẫu và đồng bộ thành công lên Cloudflare D1!');
        } else {
            alert('Đang ngoại tuyến / Lỗi mạng: Dữ liệu đã được lưu an toàn vào IndexedDB (PENDING_SYNC) và sẽ tự đồng bộ khi có mạng.');
        }
    });

    loadDashboardData();
</script>
</body>
</html>
